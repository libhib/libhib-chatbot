<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리브힙 일본어 DM 응답 도우미</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>リブヒブクリニック</h1>
  <span>일본어 DM 응답 도우미</span>
  <div class="badge">직원 전용</div>
</header>

<main class="main">
  <!-- 왼쪽: 고객 메시지 입력 -->
  <div class="panel">
    <div class="panel-header">
      <div class="dot blue"></div>
      <h2>고객 메시지 (일본어)</h2>
      <span class="sub">인스타 DM에서 복붙</span>
    </div>
    <div class="panel-body">
      <textarea
        class="customer-input"
        id="customerInput"
        placeholder="일본어 고객 메시지를 여기에 붙여넣으세요…&#10;&#10;예) はじめまして！リフティングの施術について&#10;詳しく教えていただけますか？"
      ></textarea>

      <div class="ko-label">📨 고객 메시지 번역</div>
      <div class="ko-response" id="customerKoBox" style="min-height:60px;background:#fafaf8;border:1.5px solid var(--border);border-radius:var(--radius);padding:12px;font-size:13px;color:#555;line-height:1.7;">—</div>

      <button class="generate-btn" id="generateBtn" onclick="generate()">
        ✦ 답변 생성하기
      </button>

      <div class="history-label">최근 문의</div>
      <div class="history-list" id="historyList">
        <div style="font-size:12px;color:#ccc;text-align:center;padding:12px 0;">아직 없음</div>
      </div>
    </div>
  </div>

  <!-- 오른쪽: 답변 -->
  <div class="panel">
    <div class="panel-header">
      <div class="dot green"></div>
      <h2>AI 생성 답변</h2>
      <span class="sub">일본어 + 한국어 번역</span>
    </div>
    <div class="panel-body">
      <div class="response-box" id="responseBox">
        <div class="response-empty">왼쪽에 고객 메시지를 붙여넣고<br>답변 생성하기를 눌러주세요</div>
      </div>
      <div class="action-row">
        <button class="copy-btn jp" id="copyJpBtn" onclick="copyText('jp')" disabled>
          📋 일본어 복사
        </button>
        <button class="copy-btn ko" id="copyKoBtn" onclick="copyText('ko')" disabled>
          📋 한국어 번역 복사
        </button>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="chat.js"></script>
</body>
</html>
