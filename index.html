<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리브힙 일본어 DM 도우미</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>リブヒブクリニック</h1>
  <span>일본어 DM 응답 도우미</span>
  <div class="badge">직원 전용</div>
</header>

<main class="main three-col">

  <!-- 1열: 고객 목록 -->
  <div class="panel sidebar">
    <div class="panel-header">
      <div class="dot blue"></div>
      <h2>고객 목록</h2>
      <button class="icon-btn" onclick="showAddCustomer()">＋</button>
    </div>
    <div class="panel-body" style="padding:12px;gap:8px;">
      <input class="search-input" id="searchInput" placeholder="인스타 ID 검색…" oninput="filterCustomers()">
      <div id="customerList" class="customer-list"></div>
    </div>
  </div>

  <!-- 2열: 대화 내용 -->
  <div class="panel">
    <div class="panel-header">
      <div class="dot green"></div>
      <h2 id="chatTitle">고객을 선택하세요</h2>
      <span class="sub" id="chatSub"></span>
    </div>
    <div class="panel-body" style="padding:0;">
      <div class="message-list" id="messageList">
        <div class="empty-state">왼쪽에서 고객을 선택하세요</div>
      </div>
      <div class="input-area">
        <textarea
          class="customer-input"
          id="customerInput"
          placeholder="고객 DM 내용 붙여넣기…"
          rows="2"
        ></textarea>
        <button class="generate-btn" id="generateBtn" onclick="generate()">✦ 답변 생성</button>
      </div>
    </div>
  </div>

  <!-- 3열: AI 답변 -->
  <div class="panel">
    <div class="panel-header">
      <div class="dot" style="background:var(--gold)"></div>
      <h2>AI 답변</h2>
      <span class="sub">일본어 + 한국어</span>
    </div>
    <div class="panel-body">
      <div class="ko-label">📨 고객 메시지 번역</div>
      <div class="ko-response" id="customerKoBox" style="min-height:50px;background:#fafaf8;border:1.5px solid var(--border);border-radius:var(--radius);padding:12px;font-size:13px;color:#555;line-height:1.7;margin-bottom:8px;">—</div>

      <div class="response-box" id="responseBox">
        <div class="response-empty">답변 생성하기를 눌러주세요</div>
      </div>
      <div class="action-row">
        <button class="copy-btn jp" id="copyJpBtn" onclick="copyText('jp')" disabled>📋 일본어 복사</button>
        <button class="copy-btn ko" id="copyKoBtn" onclick="copyText('ko')" disabled>📋 한국어 복사</button>
      </div>
    </div>
  </div>

</main>

<!-- 고객 추가 모달 -->
<div class="modal-bg" id="modalBg" onclick="hideModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>새 고객 추가</h3>
    <input class="modal-input" id="newInstagramId" placeholder="인스타그램 ID (예: @user_jp)">
    <input class="modal-input" id="newName" placeholder="이름 (선택)">
    <textarea class="modal-input" id="newMemo" placeholder="메모 (선택)" rows="2"></textarea>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="hideModal()">취소</button>
      <button class="modal-btn confirm" onclick="addCustomer()">추가</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="chat.js"></script>
</body>
</html>
